x-st-react: &st-react
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/usr/src/simple-twitch-react
    - node_modules:/usr/src/simple-twitch-react/node_modules

services:
  st-react:
    <<: *st-react
    container_name: st-react
    ports:
      - "3001:3000"
    environment:
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=3001
    command: [sh, -c, "[ -d node_modules/.bin ] || npm install; npm start"]

  st-react-build:
    <<: *st-react
    profiles: [build]
    command: [sh, -c, "[ -d node_modules/.bin ] || npm install; npm run build"]

  st-react-test:
    <<: *st-react
    profiles: [test]
    environment:
      - CI=true
    command: [sh, -c, "[ -d node_modules/.bin ] || npm install; npm run test:ci"]

  st-react-e2e:
    <<: *st-react
    build: !reset null
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: [e2e]
    working_dir: /usr/src/simple-twitch-react
    ipc: host
    environment:
      - CI=true
    command: [sh, -c, "[ -d node_modules/.bin ] || npm install; npm run test:e2e"]

volumes:
  node_modules:
